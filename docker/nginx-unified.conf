# XUI.one unified path-based routing (port 80/443 only)
# Included by configure-paths.sh into XUI nginx

client_max_body_size 0;
proxy_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# IPTV Live streaming
location ~ ^/(live|movie|series|streaming|hls|timeshift)/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# VOD & playlist
location ~ ^/(playlist|vod|static)/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# API endpoints (path-based, no port)
location ~ ^/(player_api|panel_api|api|get|xmltv|epg|portal)\.php$ {
    proxy_pass http://127.0.0.1:25461;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Admin panel & access codes
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
